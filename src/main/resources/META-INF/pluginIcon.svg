<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="20" cy="20" r="18" fill="#7C3AED"/>
  
  <!-- Figma-inspired design with connection symbol -->
  <!-- Left side - representing Figma -->
  <rect x="10" y="12" width="8" height="8" rx="2" fill="#FFFFFF"/>
  <rect x="10" y="20" width="8" height="8" rx="2" fill="#E0E7FF"/>
  
  <!-- Right side - representing PyCharm/Backend -->
  <rect x="22" y="12" width="8" height="8" rx="2" fill="#E0E7FF"/>
  <rect x="22" y="20" width="8" height="8" rx="2" fill="#FFFFFF"/>
  
  <!-- Connection line/bridge -->
  <line x1="18" y1="16" x2="22" y2="16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="24" x2="22" y2="24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Arrow indicating direction -->
  <path d="M20 16 L22 16 L21 15 M22 16 L21 17" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
